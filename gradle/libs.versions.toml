[versions]
springBoot = "4.1.1"
kotlin = "2.4.21"
kotlinPlugin = "2.4.21"
springDependencyManagement = "1.1.7"
cyclonedx = "2.3.1"
logstashEncoder = "8.1"
archunit = "1.4.1"
testcontainers = "2.0.5"
springdoc = "2.8.9"
jjwt = "0.12.6"
# Jackson 2 runtime set (jjwt/logstash/springdoc bring 2.x; Boot 4's own mapper is Jackson 3).
# The Kotlin module must match the 2.x databind on the runtime classpath.
jackson2 = "2.21.5"
micrometerOtel = "1.15.1"
flyway = "11.10.0"
postgresDriver = "42.7.5"
jedisOrLettuce = "6.5.3.RELEASE"
# Feature 04: the reference IDNA2008 (UTS #46) implementation for hostname
# punycode (java.net.IDN is IDNA2003 only). profile-service only.
icu4j = "77.1"
# Gradle wrapper itself is pinned to 9.8.1 (gradle-wrapper.properties). No dynamic versions anywhere.

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBoot" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server", version.ref = "springBoot" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client", version.ref = "springBoot" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "springBoot" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache", version.ref = "springBoot" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers", version.ref = "springBoot" }
micrometer-registry-otlp = { module = "io.micrometer:micrometer-registry-otlp", version.ref = "micrometerOtel" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway", version.ref = "springBoot" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgresDriver" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson2" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-junit5 = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version = "4.1.1" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
