# Load-run balancer (scale overlay only). Round-robins across compose replicas
# via the embedded DNS; health-gated upstream peers. Not part of the serving
# contract (production uses edge cache/CDN in front of the same origins).
upstream public_site {
  server public-site-service:8080 max_fails=2 fail_timeout=10s;
  keepalive 32;
}
upstream link_redirector {
  server link-service:8080 max_fails=2 fail_timeout=10s;
  keepalive 32;
}
upstream analytics {
  server analytics-service:8080 max_fails=2 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 8184;
  location / { proxy_pass http://public_site; }
  location /health/liveness { proxy_pass http://public_site; }
}
server {
  listen 8183;
  location / { proxy_pass http://link_redirector; }
}
server {
  listen 8185;
  location / { proxy_pass http://analytics; }
}
