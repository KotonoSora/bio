# Nginx edge main config (09-local-storage-and-nginx-spec.md,
# 04-containers-and-compose.md). Serves the SPA + /media/* from the read-only
# uploads mount, proxies /api/*, /go/*, /:username to the gateway, edge-caches
# public reads, applies security headers and route-class limit_req.
# JSON access logs: stdout + the data-root log bind (./data/logs/nginx).

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream":"$upstream_addr","trace":"$http_traceparent",'
    '"cache":"$upstream_cache_status"}';
  access_log /dev/stdout json;
  access_log /var/log/nginx/access.log json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  autoindex off;                 # no listing anywhere (09)
  absolute_redirect off;         # edge-issued 3xx stay frame-relative (feature 03)
  client_max_body_size 25m;      # resumable upload chunks ride /api/v1

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Edge cache for public reads: TTL-bounded staleness (60 s platform heal
  # bound, 01); publish purges shorten it where a spec declares one.
  proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge_public:10m
    max_size=512m inactive=60s use_temp_path=off;

  # Route-class envelopes (08-security-baseline gateways stay authoritative;
  # stricter feature numbers win, loosening needs a flagged amendment).
  limit_req_zone $binary_remote_addr zone=anon_reads:10m rate=2r/s;    # 120 req/min/IP
  limit_req_zone $binary_remote_addr zone=auth_routes:10m rate=20r/m;  # 20 req/min/IP
  limit_req_zone $binary_remote_addr zone=beacon_intake:10m rate=1r/s; # 60 req/min/IP, burst tolerated
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
