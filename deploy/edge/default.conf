# Edge virtual servers (09-local-storage-and-nginx-spec.md): ports 80/443.
# Both serve the same locations; TLS uses mounted certs in production and a
# dev self-signed pair generated by the entrypoint when none are mounted.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  include /etc/nginx/edge/security-headers.conf;

  location = /health/liveness { default_type text/plain; return 200 "UP"; }
  location = /health/readiness { default_type text/plain; return 200 "UP"; }

  include /etc/nginx/edge/locations.conf;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:edge_ssl:10m;
  ssl_session_timeout 1h;

  include /etc/nginx/edge/security-headers.conf;

  location = /health/liveness { default_type text/plain; return 200 "UP"; }
  location = /health/readiness { default_type text/plain; return 200 "UP"; }

  include /etc/nginx/edge/locations.conf;
}
