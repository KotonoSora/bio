# Security headers shared by both virtual servers and by locations that set
# their own add_header directives (nginx add_header inheritance is replacement,
# not merge). CSP default-src self for public documents (08-security-baseline).
# form-action allows 'self' plus any https target: SSO sign-in/step-up/recovery
# are navigation-POST forms whose server-issued 302 must reach the IdP
# (BA 01-account-and-access 03 step 1); Chrome enforces form-action on redirect
# hops, and generic OIDC issuers are runtime config, so origins cannot be
# enumerated here.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https:" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
