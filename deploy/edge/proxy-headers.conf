# Upstream proxy contract to the gateway (01-architecture-and-service-topology.md):
# service peers stay stateless behind the edge, W3C traceparent propagates
# gateway -> service -> queue, and the platform 2 s per-source connect budget
# applies. Session cookies terminate here; services never read them.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header traceparent $http_traceparent;
proxy_connect_timeout 2s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_next_upstream error timeout;
