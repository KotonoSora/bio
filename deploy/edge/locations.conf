# Shared edge locations, included by both virtual servers (80/443).
# Ordering notes: prefix locations win by longest match; the only regex location
# is the /:username SSR page, tested after prefixes. `location /` is a 404 -
# unknown paths are never a listing or a guess.

# Throttle responses are 429 + Retry-After (08-security-baseline).
error_page 429 @throttled;
location @throttled {
  internal;
  default_type application/json;
  add_header Retry-After 60 always;
  add_header Cache-Control "no-store" always;
  include /etc/nginx/edge/security-headers.conf;
  return 429 '{"type":"about:blank","title":"too_many_requests","status":429,"code":"rate_limited"}';
}

# --- Internal mesh + gated bytes: never reachable from clients (09) ---
location ^~ /internal/ { return 404; }
# Gated downloads: services validate the short-TTL grant, then answer
# X-Accel-Redirect: /internal-media/<namespace>/<name>; only that internal
# redirect reaches the read-only uploads mount.
location ^~ /internal-media/ {
  internal;
  alias /srv/media/;
}

# --- Public media (read-only mount; unguessable names are the access control) ---
location = /media/ { return 404; }
location ^~ /media/profile/avatars/ {
  limit_req zone=anon_reads burst=20 nodelay;
  alias /srv/media/profile/avatars/;
  include /etc/nginx/edge/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location ^~ /media/resume/gallery/ {
  limit_req zone=anon_reads burst=20 nodelay;
  alias /srv/media/resume/gallery/;
  include /etc/nginx/edge/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location ^~ /media/shop/covers/ {
  limit_req zone=anon_reads burst=20 nodelay;
  alias /srv/media/shop/covers/;
  include /etc/nginx/edge/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
# Allowlist-only: every other namespace (supported or gated) stays gated.
location ^~ /media/ { return 404; }

# --- SPA shell + MFE bundles (build baked at image build; routes under /app/*) ---
location = / { return 302 /app/; }
location = /app { return 302 /app/; }
# Auth entry points emitted by server redirects (`/auth/error`) and the login
# bookmark: the SPA is only served under /app/, so translate at the edge.
location = /login { return 302 /app/login; }
location = /auth/error { return 302 /app/auth/error; }
location ^~ /app/assets/ {
  root /usr/share/nginx/html;
  try_files $uri =404;
  include /etc/nginx/edge/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
# Versioned MFE bundles (platform doc 10): immutable like shell assets. The
# manifest (`/app/mfe.manifest.json`) intentionally falls through to the
# no-cache /app/ rule below.
location ^~ /app/mfe/ {
  root /usr/share/nginx/html;
  try_files $uri =404;
  include /etc/nginx/edge/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location /app/ {
  root /usr/share/nginx/html;
  try_files $uri /app/index.html;
  include /etc/nginx/edge/security-headers.conf;
  add_header Cache-Control "no-cache" always;
}

# --- Session API -> gateway (route-class envelopes; 08) ---
location ^~ /api/v1/auth/ {
  limit_req zone=auth_routes burst=10 nodelay;
  proxy_pass http://gateway:8080;
  include /etc/nginx/edge/proxy-headers.conf;
}
location ^~ /api/t/ {
  limit_req zone=beacon_intake burst=30 nodelay;
  proxy_pass http://gateway:8080;
  include /etc/nginx/edge/proxy-headers.conf;
}
location ^~ /api/ {
  proxy_pass http://gateway:8080;
  include /etc/nginx/edge/proxy-headers.conf;
}

# --- Webhooks -> gateway (signature-verified per provider downstream) ---
location ^~ /webhooks/ {
  proxy_pass http://gateway:8080;
  include /etc/nginx/edge/proxy-headers.conf;
}

# --- Short links: never edge-cached (every hit must reach the redirector) ---
location ^~ /go/ {
  limit_req zone=anon_reads burst=40 nodelay;
  proxy_pass http://gateway:8080;
  include /etc/nginx/edge/proxy-headers.conf;
}

# --- Public resume reads (/cv) + the profile micro-script ---
location ^~ /cv/ {
  proxy_pass http://gateway:8080;
  include /etc/nginx/edge/proxy-headers.conf;
}
location = /s/ms.js {
  proxy_pass http://gateway:8080;
  include /etc/nginx/edge/proxy-headers.conf;
}

# --- Public SSR profile pages: cache-first at the edge, TTL-bound (01/07) ---
location ~ "^/(?<slug>[A-Za-z0-9][A-Za-z0-9_-]{0,62})$" {
  limit_req zone=anon_reads burst=20 nodelay;
  proxy_pass http://gateway:8080;
  include /etc/nginx/edge/proxy-headers.conf;
  proxy_cache edge_public;
  proxy_cache_key "$scheme$host$request_uri";
  proxy_cache_valid 200 60s;
  proxy_cache_bypass $http_authorization;
  proxy_no_cache $upstream_http_set_cookie $upstream_http_x_accel_redirect;
  include /etc/nginx/edge/security-headers.conf;
  add_header X-Cache-Status $upstream_cache_status always;
}

# --- No catch-all: unknown paths are 404 ---
location / { return 404; }
