server:
  port: ${SERVER_PORT:8080}
  # SIGTERM graceful shutdown: drain in-flight requests, close queue consumers.
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 1

# Edge session + CSRF contract (feature 01 D-2/D-6); SSO itself runs behind
# account-service (`/api/auth/**`), so no OAuth2 client registration exists here.
edge:
  session:
    cookie-name: ${SESSION_COOKIE_NAME:rb_session}
    idle-days: ${SESSION_IDLE_DAYS:7}
  csrf:
    cookie-name: ${CSRF_COOKIE_NAME:csrf_token}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
  # Introspect rebuild target (edge key miss / db 2 loss); mesh DNS in compose.
  account-service-url: ${ACCOUNT_SERVICE_URL:http://account-service:8080}
  # Feature 04 host routing: foreign-host resolve target (positive 30 s /
  # negative 60 s decision cache) and the platform host list that skips it.
  profile-service-url: ${PROFILE_SERVICE_URL:http://profile-service:8080}
  platform-hosts: ${EDGE_PLATFORM_HOSTS:localhost,127.0.0.1,::1}
  host-resolve-timeout-ms: ${EDGE_HOST_RESOLVE_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      service: gateway
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

internal:
  jwt:
    private-key-pem: ${INTERNAL_JWT_PRIVATE_KEY_PEM:}
    audience: gateway
    kid: ${INTERNAL_JWT_KID:e0-dev-key}
    ttl-seconds: 60

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=gateway trace=%X{traceId:-} level=%-5level msg=%m%n"
