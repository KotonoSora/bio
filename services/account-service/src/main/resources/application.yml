server:
  port: ${SERVER_PORT:8080}
  # SIGTERM graceful shutdown: drain in-flight requests, close the sweeper.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: account-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/account_db}
    username: ${SPRING_DATASOURCE_USERNAME:account_app}
    password: ${SPRING_DATASOURCE_PASSWORD:account_dev_only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      pool-name: account-pool
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # Migrator role (DDL, migrations only). App DSN never carries migration rights.
    user: ${SPRING_FLYWAY_USER:account_migrator}
    password: ${SPRING_FLYWAY_PASSWORD:account_migrator_dev_only}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Own keys (db 7); the edge session namespace lives in platform db 2 (D-2).
      database: 7
      edge-database: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      service: account-service
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

internal:
  jwt:
    public-key-pem: ${INTERNAL_JWT_PUBLIC_KEY_PEM:}
    previous-public-key-pem: ${INTERNAL_JWT_PREVIOUS_PUBLIC_KEY_PEM:}
    audience: account-service

# Outbound mesh credential for /internal/v1 calls (blank = dev, no header sent).
mesh:
  jwt:
    private-key-pem: ${MESH_JWT_PRIVATE_KEY_PEM:}
    kid: ${INTERNAL_JWT_KID:e0-dev-key}

service:
  ratelimit:
    per-minute: ${SERVICE_RATELIMIT_PER_MINUTE:120}

account:
  auth:
    # Same-origin relative allowlist for callbackURL/returnTo (BR-04).
    allowed-return-prefixes: /app,/welcome,/account
    recovery-signing-key: ${RECOVERY_SIGNING_KEY:}
    state-ttl-seconds: 600
  session:
    idle-days: 7
    absolute-days: 90
    quota: 50
    step-up-seconds: 600
    cookie-name: ${SESSION_COOKIE_NAME:rb_session}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
    sweep-interval-ms: ${SESSION_SWEEP_INTERVAL_MS:60000}
  oauth:
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost}
    providers:
      # Closed provider set (BR-01): config-only additions; secrets via env/vault (S-10).
      google:
        enabled: ${OAUTH_GOOGLE_ENABLED:true}
        label: Google
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        scopes: openid,profile,email
        authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        issuer: https://accounts.google.com
        client-auth: post
      apple:
        enabled: ${OAUTH_APPLE_ENABLED:true}
        label: Apple
        client-id: ${APPLE_CLIENT_ID:}
        client-secret: ${APPLE_CLIENT_SECRET:}
        scopes: openid,name,email
        authorize-uri: https://appleid.apple.com/auth/authorize
        token-uri: https://appleid.apple.com/auth/token
        jwk-set-uri: https://appleid.apple.com/auth/keys
        issuer: https://appleid.apple.com
      facebook:
        enabled: ${OAUTH_FACEBOOK_ENABLED:true}
        label: Facebook
        client-id: ${FACEBOOK_CLIENT_ID:}
        client-secret: ${FACEBOOK_CLIENT_SECRET:}
        scopes: public_profile,email
        authorize-uri: https://www.facebook.com/v19.0/dialog/oauth
        token-uri: https://graph.facebook.com/v19.0/oauth/access_token
        userinfo-uri: https://graph.facebook.com/v19.0/me?fields=id,name,email
        subject-claim: id
        client-auth: post
      linkedin:
        enabled: ${OAUTH_LINKEDIN_ENABLED:true}
        label: LinkedIn
        client-id: ${LINKEDIN_CLIENT_ID:}
        client-secret: ${LINKEDIN_CLIENT_SECRET:}
        scopes: openid,profile,email
        authorize-uri: https://www.linkedin.com/oauth/v2/authorization
        token-uri: https://www.linkedin.com/oauth/v2/accessToken
        userinfo-uri: https://api.linkedin.com/v2/userinfo
        jwk-set-uri: https://www.linkedin.com/oauth/openid/jwks
        issuer: https://www.linkedin.com/oauth
      generic-oidc:
        enabled: ${GENERIC_OIDC_ENABLED:false}
        label: ${GENERIC_OIDC_LABEL:Company SSO}
        client-id: ${GENERIC_OIDC_CLIENT_ID:}
        client-secret: ${GENERIC_OIDC_CLIENT_SECRET:}
        authorize-uri: ${GENERIC_OIDC_AUTHORIZE_URI:}
        token-uri: ${GENERIC_OIDC_TOKEN_URI:}
        userinfo-uri: ${GENERIC_OIDC_USERINFO_URI:}
        jwk-set-uri: ${GENERIC_OIDC_JWK_SET_URI:}
        issuer: ${GENERIC_OIDC_ISSUER:}
  services:
    profile-base-url: ${PROFILE_SERVICE_URL:http://profile-service:8080}
    billing-base-url: ${BILLING_SERVICE_URL:http://billing-service:8080}
    entitlement-cache-seconds: 30
    handoff-cache-seconds: 60
    timeout-ms: 2000
  mail:
    # log = no transport configured (dev). Codes are never logged or auto-verified.
    mode: ${ACCOUNT_MAIL_MODE:log}
  deletion:
    # Feature 02 (TL 01 D-4/D-6): day-30 purge, day-23 reminder, daily 03:30 UTC run.
    grace-days: 30
    reminder-after-days: 23
    purge-cron: ${ACCOUNT_PURGE_CRON:0 30 3 * * *}
    reminder-cron: ${ACCOUNT_REMINDER_CRON:0 45 3 * * *}
    probe-cron: ${ACCOUNT_PROBE_CRON:0 0 4 * * 1}
    # Certificate volume: ./data/uploads/account mounted rw (never served by the edge).
    storage-root: ${STORAGE_ROOT:/srv/uploads}
    legal-hold: ${ACCOUNT_LEGAL_HOLD:false}
    stuck-after-hours: 24
    participant-retries: 3
    # Roster discipline: registered participants; account-service itself is
    # implicit (in-process handler). Dev boot warns + counts when unreachable;
    # strict-participants=true fails startup (production posture).
    strict-participants: ${ACCOUNT_STRICT_PARTICIPANTS:false}
    retention-years: ${ACCOUNT_RETENTION_YEARS:}
    hash-buyer-email: ${ACCOUNT_HASH_BUYER_EMAIL:false}
    participants:
      - name: profile-service
        base-url: ${PROFILE_SERVICE_URL:http://profile-service:8080}
      - name: link-service
        base-url: ${LINK_SERVICE_URL:http://link-service:8080}
      - name: analytics-service
        base-url: ${ANALYTICS_SERVICE_URL:http://analytics-service:8080}

concierge:
  # Feature 05 (TL 01 D-6). SLA windows are Q-01: blank = not configured, the
  # board reports that honestly - never an invented number. The dev/e2e wiring
  # (e2e/scripts/enable-concierge.sh) sets zero-minute windows for the miss drill.
  owner-user-ids: ${CONCIERGE_OWNER_USER_IDS:}
  sla-tiers:
    standard:
      response-minutes: ${CONCIERGE_SLA_STANDARD_RESPONSE_MINUTES:}
      completion-minutes: ${CONCIERGE_SLA_STANDARD_COMPLETION_MINUTES:}
    rapid:
      response-minutes: ${CONCIERGE_SLA_RAPID_RESPONSE_MINUTES:}
      completion-minutes: ${CONCIERGE_SLA_RAPID_COMPLETION_MINUTES:}
  credit-rule: ${CONCIERGE_CREDIT_RULE:service_credit}
  referral-url: ${CONCIERGE_REFERRAL_URL:/app/concierge}
  link-ttl-minutes: 15
  link-signing-key: ${CONCIERGE_LINK_SIGNING_KEY:}
  requests-per-day: ${CONCIERGE_REQUESTS_PER_DAY:20}
  client-actions-per-minute: ${CONCIERGE_CLIENT_ACTIONS_PER_MINUTE:60}
  ops-per-minute: ${CONCIERGE_OPS_PER_MINUTE:120}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=account-service trace=%X{traceId:-} level=%-5level msg=%m%n"
